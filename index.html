<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アイカツ！交流イベント</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
<style>
body{
  margin:0;
  font-family:'Noto Sans JP', sans-serif;
  background:#ffffff;
  color:#333;
  line-height:1.9;
}

.hero img{
  width:100%;
  display:block;
}

.section{
  max-width:820px;
  margin:100px auto;
  padding:0 24px;
}

h2{
  font-size:30px;
  margin-bottom:24px;
  color:#ff6fa3;
  font-weight:600;
  letter-spacing:0.03em;
}

p{
  font-size:17px;
}

@media (max-width: 600px){
  .section{
    margin:60px auto;
  }
  h2{
    font-size:24px;
  }
  p{
    font-size:16px;
  }
}
  .button-area{
  text-align:center;
  margin-top:40px;
}

.cta-button{
  display:inline-block;
  padding:16px 40px;
  background:#ff6fa3;
  color:#ffffff;
  text-decoration:none;
  font-weight:600;
  border-radius:50px;
  font-size:18px;
  transition:0.3s;
}

.cta-button:hover{
  opacity:0.8;
}
</style>

</head>
<body>

<div class="hero">
  <img src="たけトラ2ラフ.png" alt="イベントビジュアル">
</div>

<div class="section">
  <h2>はじめてでも、大丈夫。</h2>
  <p>
  アイカツ！同人作家のための交流イベント。<br>
  あなたの創作の“中継点（トランジット）”になる場を目指しています。
  </p>
</div>

<br><br>
<a href="#apply">申込はこちら</a>
  
<div class="section">
  <h2>開催実績</h2>
  <p>
  過去3回開催。各回30名前後が参加。
  </p>
</div>

  <div class="section">
  <h2>参加をご検討の方へ</h2>
  <p>
  はじめての方も歓迎しています。<br>
  ゆったり交流できる雰囲気を大切にしています。
  </p>
</div>
  
<div class="section">
  <h2>参加申込</h2>
  <p>
  下記リンクのツイプラよりお申し込みください。
  </p>

<div class="section" id="apply">
    <a href="https://twipla.jp/events/715308" class="cta-button">
      参加申し込みはこちら
    </a>
  </div>
</div>
</body>
</html>
